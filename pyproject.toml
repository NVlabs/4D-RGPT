[project]
name = "4d-rgpt"
version = "0.1.0"
description = "4D-RGPT: a region-grounded multimodal LLM for 4D (3D + time) video understanding."
readme = "README.md"
requires-python = "==3.11.*"
# v4 stack — pinned to match 4d_rvila's reference environment so eval_old
# numbers reproduce exactly. transformers 5 / SDPA on Qwen2 produces a
# ~8pt bf16 argmax drift on close-call MCQ tokens (e.g. R4D-Bench: 30 vs
# the v4 reference 38.9 on NVILA-Lite-8B). Pivoted back to v4 on 2026-05-26.
dependencies = [
    "accelerate==0.34.*",
    "datasets>=2.19.1",
    "eva-decord>=0.6.1",
    "deepspeed==0.14.*",
    "einops>=0.8.2",
    "ffmpeg>=1.4",
    "flash-attn",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "markupsafe==2.1.5",
    "moviepy>=2.2.1",
    "openai>=2.29.0",
    "opencv-python>=4.13.0.92",
    "peft==0.15.*",
    "packaging>=24.1",
    "pandas>=2.0",
    "python-dotenv>=1.2.2",
    "qwen-vl-utils>=0.0.14",
    "s2wrapper",
    "setuptools>=70.2.0",
    "supervision>=0.27.0.post2",
    "tabulate>=0.10.0",
    "timm>=1.0.26",
    "torch==2.3.*",
    "tyro>=0.9.0",
    "torchaudio==2.3.*",
    "torchvision==0.18.*",
    "transformers==4.46.*",
    "wheel>=0.46.3",
    "pypdf>=6.11.0",
    "open3d>=0.19.0",
    "lmms-eval",
    # Required by third_party/L4P/l4p/models/aligner.py (ransac + SimilarityTransform).
    "scikit-image>=0.24",
    # torchcodec dropped on v4 pivot — no cp311 linux x86_64 wheel for
    # torchcodec versions that build against torch 2.3. qwen-vl-utils has
    # a decord fallback (see llava/eval/lmms/__main__._patch_qwenvl_smart_nframes).
    "requests>=2.32",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
s2wrapper = { git = "https://github.com/bfshi/scaling_on_scales.git" }
# Closest prebuilt wheel to internal repo's installed flash_attn 2.5.8: 2.5.6+cu121torch2.3
# from the same mjun0812 release source we used for v5. Both 2.5.6 and 2.5.8 are
# API-identical for Qwen2's use; only bugfix-level differences between them.
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.0.2/flash_attn-2.5.6%2Bcu121torch2.3-cp311-cp311-linux_x86_64.whl" }
lmms-eval = { path = "tools/vlm/lmms-eval/repo", editable = true }
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[dependency-groups]
dev = [
    "gdown>=6.0.0",
]
